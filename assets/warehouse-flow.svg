<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">仓库作业流向示意图</title>
  <desc id="desc">展示拣货、验货、称重、发货、上下架和拆包区域的仓库流向。</desc>
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf8f3"/>
      <stop offset="1" stop-color="#f7f1e4"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f8b8d"/>
      <stop offset="1" stop-color="#2e9d58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#17323a" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="720" height="560" fill="url(#floor)"/>
  <path d="M52 438h616v64H52z" fill="#dce7e4"/>
  <path d="M88 470h544" stroke="#93aaa6" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 18"/>
  <g filter="url(#shadow)">
    <rect x="64" y="54" width="168" height="132" rx="8" fill="#fff"/>
    <rect x="276" y="54" width="168" height="132" rx="8" fill="#fff"/>
    <rect x="488" y="54" width="168" height="132" rx="8" fill="#fff"/>
    <rect x="64" y="262" width="168" height="132" rx="8" fill="#fff"/>
    <rect x="276" y="262" width="168" height="132" rx="8" fill="#fff"/>
    <rect x="488" y="262" width="168" height="132" rx="8" fill="#fff"/>
  </g>
  <g fill="#10242d" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-weight="700">
    <text x="92" y="92" font-size="24">拣货区</text>
    <text x="304" y="92" font-size="24">验货台</text>
    <text x="516" y="92" font-size="24">称重区</text>
    <text x="92" y="300" font-size="24">上下架</text>
    <text x="304" y="300" font-size="24">拆包区</text>
    <text x="516" y="300" font-size="24">发货口</text>
  </g>
  <g fill="#66717b" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15">
    <text x="92" y="124">订单 11,818 单</text>
    <text x="304" y="124">验货 14,983 件</text>
    <text x="516" y="124">待补采集</text>
    <text x="92" y="332">17,893 件</text>
    <text x="304" y="332">9,189 件</text>
    <text x="516" y="332">15,508 件</text>
  </g>
  <g fill="none" stroke="url(#belt)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 120h44"/>
    <path d="M444 120h44"/>
    <path d="M572 186v76"/>
    <path d="M488 328h-44"/>
    <path d="M276 328h-44"/>
    <path d="M148 262v-76"/>
  </g>
  <g fill="#fff" stroke="#0f8b8d" stroke-width="4">
    <circle cx="252" cy="120" r="12"/>
    <circle cx="466" cy="120" r="12"/>
    <circle cx="572" cy="226" r="12"/>
    <circle cx="466" cy="328" r="12"/>
    <circle cx="254" cy="328" r="12"/>
    <circle cx="148" cy="226" r="12"/>
  </g>
  <g>
    <rect x="96" y="144" width="24" height="22" rx="4" fill="#f2b64b"/>
    <rect x="128" y="138" width="24" height="28" rx="4" fill="#f2b64b"/>
    <rect x="160" y="148" width="24" height="18" rx="4" fill="#f2b64b"/>
    <rect x="306" y="142" width="104" height="12" rx="6" fill="#dbe2e5"/>
    <rect x="306" y="160" width="76" height="12" rx="6" fill="#dbe2e5"/>
    <rect x="520" y="140" width="78" height="44" rx="6" fill="#dbe2e5"/>
    <rect x="98" y="350" width="92" height="16" rx="4" fill="#dbe2e5"/>
    <rect x="98" y="372" width="68" height="16" rx="4" fill="#dbe2e5"/>
    <path d="M314 360h92v28h-92z" fill="#f2b64b"/>
    <path d="M320 352h80v10h-80z" fill="#d08a1d"/>
    <path d="M524 356h96v36h-96z" fill="#2f6fbb"/>
    <path d="M536 342h72v20h-72z" fill="#6b5fb5"/>
  </g>
</svg>
